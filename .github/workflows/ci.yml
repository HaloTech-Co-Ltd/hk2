name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The suite exercises Node-version-sensitive surface on purpose:
    #   - the REPL mid-task input box rides readline PRIVATE APIs
    #     (rl._writeToOutput / rl.line / rl.cursor) — engines say >=18, so
    #     the matrix must catch the day a Node major drifts underneath
    #   - byte-level StatusBar/TUI tests and real-PTY tests depend on a
    #     capability-bearing TERM (each file forces its own via _tty_env)
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: full suite (default env)
        run: npm test
      - name: full suite (NO_COLOR)
        run: npm test
        env:
          NO_COLOR: '1'
      - name: full suite (TERM=dumb)
        run: npm test
        env:
          TERM: dumb
      - name: PTY + readline-private-surface + input-box coverage
        run: >-
          node --test
          test/repl_midtask_pty.test.js
          test/tui_pty.test.js
          test/statusbar-inputbox.test.js
          test/tui_input_box.test.js
